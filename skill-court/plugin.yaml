name: skill-court
version: 1.2.0
description: >-
  Measures whether each agent-written skill actually helps: replays real tasks with and
  without the skill, scores the difference (a sandbox check, or a blind pairwise judge when a
  task has none), and quarantines skills that make results worse for a given model, without
  editing the skill's files. On by default, on a $1.00 daily replay budget and 300,000 judge
  tokens a day: it tests each skill the agent writes or changes, and each skill the agent wrote
  (before or after install) the first time its current version is used on a model, in Docker
  sandboxes or, without Docker, answer-only. Shows how often each skill is used, from recent session
  history. An appeal drafts a fix and proves it on the same tasks; the fix is written only when
  the user applies it.
author: saatvik333
license: MIT
requires_hermes: ">=0.23.0"
platforms: [linux, macos]
provides_hooks:
  - pre_tool_call
  - transform_tool_result
  - on_skill_lifecycle
  - on_session_finalize
  - pre_llm_call
provides_middleware:
  - llm_request
