name: skill-court
version: 1.1.1
description: >-
  Measures whether each agent-written skill actually helps: replays real tasks with and
  without the skill, scores the difference (a sandbox check, or a blind pairwise judge when a
  task has none), and quarantines skills that make results worse for a given model, without
  editing the skill's files. An appeal drafts a fix and proves it on the same tasks; the fix is
  written only when the user applies it. Optionally tests each skill automatically after the
  agent writes it.
author: saatvik333
license: MIT
requires_hermes: ">=0.23.0"
platforms: [linux, macos]
provides_hooks:
  - pre_tool_call
  - transform_tool_result
  - on_skill_lifecycle
  - on_session_finalize
  - pre_llm_call
provides_middleware:
  - llm_request
